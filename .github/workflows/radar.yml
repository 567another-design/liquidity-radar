name: Dual-Engine USD Liquidity Radar



on:

  schedule:

    # 每个美股交易日 13:23 UTC (北京时间晚上 21:23，美股开盘前约1小时，避开整点排队延迟)

    - cron: '23 13 * * 1-5'

  workflow_dispatch:



jobs:

  run-liquidity-radar:

    runs-on: ubuntu-latest

    steps:

      - name: Run Dual-Engine USD Liquidity Radar & Push WeChat

        env:

          GITHUB_EVENT_NAME: ${{ github.event_name }}

        run: |

          python3 - << 'EOF'

          import os, sys, json, datetime, traceback, urllib.request, urllib.parse



          DEFAULT_PUSHPLUS_TOKEN = "20e17886ceaf4a9c9d4cf1a061844759"

          CURRENT_IORB = 3.90

          CURRENT_SRF_CEILING = 4.00



          def fetch_nyfed_sofr_history(last_n=15):

              url = f"https://markets.newyorkfed.org/api/rates/secured/sofr/last/{last_n}.json"

              try:

                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})

                  with urllib.request.urlopen(req, timeout=10) as resp:

                      data = json.loads(resp.read().decode("utf-8"))

                  rates = sorted(data.get("refRates", []), key=lambda x: x.get("effectiveDate", ""))

                  result = []

                  for r in rates:

                      dt = r.get("effectiveDate", "")

                      rate = float(r.get("percentRate", CURRENT_IORB))

                      p99 = float(r.get("percentPercentile99", rate + 0.07))

                      vol = float(r.get("volumeInBillions", 0) or 0)

                      result.append({"date": dt, "sofr": rate, "p99": p99, "vol_b": vol})

                  return result

              except Exception as e:

                  print(f"[WARN] NYFed SOFR 接口异常: {e}")

                  return []



          def fetch_nyfed_srf_usage():

              url = "https://markets.newyorkfed.org/api/rp/results/search.json"

              try:

                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})

                  with urllib.request.urlopen(req, timeout=10) as resp:

                      data = json.loads(resp.read().decode("utf-8"))

                  ops = data.get("repo", {}).get("operations", [])

                  repo_ops = [op for op in ops if str(op.get("operationType", "")).lower().startswith("repo")]

                  if not repo_ops:

                      return ("最近交易日", 0.0)

                  latest_date = max(str(op.get("operationDate", "")) for op in repo_ops)

                  daily_total = sum(float(op.get("totalAmtAccepted", 0) or 0) for op in repo_ops if op.get("operationDate") == latest_date)

                  srf_b = daily_total / 1e9 if daily_total > 1e7 else (daily_total / 1e3 if daily_total > 1e3 else daily_total)

                  return (latest_date, round(srf_b, 2))

              except Exception as e:

                  print(f"[WARN] NYFed SRF 接口异常: {e}")

                  return ("N/A", 0.0)



          def fetch_yahoo_quote(ticker, default_val=0.0):

              try:

                  enc = urllib.parse.quote(ticker)

                  url = f"https://query2.finance.yahoo.com/v8/finance/chart/{enc}?interval=1d&range=15d&includePrePost=true"

                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

                  with urllib.request.urlopen(req, timeout=10) as resp:

                      data = json.loads(resp.read().decode("utf-8"))

                  res = data["chart"]["result"][0]

                  meta = res.get("meta", {})

                  ts_list = res.get("timestamp", [])

                  c_list = res["indicators"]["quote"][0].get("close", [])

                  valid = [(datetime.datetime.utcfromtimestamp(ts).strftime("%Y-%m-%d"), round(float(c), 2)) for ts, c in zip(ts_list, c_list) if c is not None]

                  if len(valid) >= 2:

                      dt, lc = valid[-1]

                      _, pc = valid[-2]

                      live_p = meta.get("regularMarketPrice")

                      if live_p is not None and abs(float(live_p) - lc) > 1e-4:

                          lc = round(float(live_p), 2)

                      pct = ((lc - pc) / pc) * 100.0 if pc else 0.0

                      high_5d = round(max(c for _, c in valid[-6:]), 2)

                      return (lc, round(pct, 2), dt, high_5d)

              except Exception as e:

                  print(f"[WARN] Yahoo {ticker}: {e}")

              return (default_val, 0.0, "N/A", default_val)



          def classify_calendar(dt_str):

              try:

                  d = datetime.date.fromisoformat(dt_str)

              except Exception:

                  return (False, False, "常规交易日")

              nxt = (d.replace(day=28) + datetime.timedelta(days=4)).replace(day=1)

              last_day = nxt - datetime.timedelta(days=1)

              bdays_left = sum(1 for i in range((last_day - d).days + 1) if (d + datetime.timedelta(days=i)).weekday() < 5)

              if bdays_left <= 4 or d.day <= 2:

                  return (True, False, "月末/跨节资金结算窗口 (最后3个交易日，自动过滤短期回购冲高)")

              if d.day in (15, 16, 17):

                  return (False, True, "月中国债结算/缴税窗口 (降权1级观察T+2)")

              return (False, False, "常规非月末交易日 (有效权重 100%)")



          def send_pushplus(token, title, content_md):

              url = "https://www.pushplus.plus/send"

              body = json.dumps({"token": token, "title": title, "content": content_md, "template": "markdown"}).encode("utf-8")

              req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}, method="POST")

              with urllib.request.urlopen(req, timeout=15) as resp:

                  print("[INFO] PushPlus 返回:", resp.read().decode("utf-8"))



          token = os.getenv("PUSHPLUS_TOKEN", "").strip() or DEFAULT_PUSHPLUS_TOKEN

          is_manual = os.getenv("GITHUB_EVENT_NAME", "") != "schedule"



          try:

              sofr_hist = fetch_nyfed_sofr_history(15)

              history = []

              for item in sofr_hist:

                  is_me, is_mid, cal_lbl = classify_calendar(item["date"])

                  sp_bps = round((item["sofr"] - CURRENT_IORB) * 100.0, 1)

                  history.append({

                      "date": item["date"],

                      "sofr": item["sofr"],

                      "p99": item["p99"],

                      "vol_b": item["vol_b"],

                      "spread_bps": sp_bps,

                      "is_me": is_me,

                      "is_mid": is_mid,

                      "cal": cal_lbl,

                  })

              if not history:

                  history = [{"date": datetime.date.today().isoformat(), "sofr": 3.90, "p99": 3.98, "vol_b": 0.0, "spread_bps": 0.0, "is_me": False, "is_mid": False, "cal": "常规交易日"}]



              latest = history[-1]

              spread_bps = latest["spread_bps"]

              sofr_p99 = latest["p99"]

              non_me = [h for h in history if not h["is_me"]][-6:]

              consec_gt_2 = 0

              for h in reversed(non_me):

                  if h["spread_bps"] >= 2.0:

                      consec_gt_2 += 1

                  else:

                      break

              recent_max = max((h["spread_bps"] for h in non_me), default=0.0)

              repo_healed = (recent_max >= 3.0) and len(non_me) >= 2 and all(h["spread_bps"] <= 0.5 for h in non_me[-2:])



              srf_date, srf_b = fetch_nyfed_srf_usage()



              vix_c, vix_chg, vix_dt, vix_5d_h = fetch_yahoo_quote("^VIX", 20.0)

              dxy_c, dxy_chg, _, _ = fetch_yahoo_quote("DX-Y.NYB", 104.0)

              _, spy_chg, _, _ = fetch_yahoo_quote("SPY", 0.0)

              _, qqq_chg, _, _ = fetch_yahoo_quote("QQQ", 0.0)

              _, gld_chg, _, _ = fetch_yahoo_quote("GLD", 0.0)



              vix_pullback_from_high = ((vix_c - vix_5d_h) / vix_5d_h * 100.0) if vix_5d_h > 0 else 0.0

              vix_is_rising = vix_chg > 3.0

              vix_is_cooling = (vix_5d_h >= 28.0) and (vix_chg <= -4.0 or vix_pullback_from_high <= -15.0)



              alerts, buys, cautions = [], [], []

              risk = 1



              if not latest["is_me"]:

                  if spread_bps >= 4.0 and (sofr_p99 > CURRENT_SRF_CEILING or srf_b >= 15.0):

                      risk = 3

                      alerts.append(f"【回购逼仓红灯】非月末 SOFR 达 {latest['sofr']:.2f}% (高出 IORB +{spread_bps}bp)，99分位 {sofr_p99:.2f}%，SRF用量 ${srf_b}B")

                  elif consec_gt_2 >= 3:

                      risk = max(risk, 2)

                      alerts.append(f"【回购吃紧橙灯】非月末 SOFR-IORB 已连续 {consec_gt_2} 日 >= +2bp (当前 +{spread_bps}bp)")

                  elif sofr_p99 > CURRENT_SRF_CEILING and srf_b >= 10.0:

                      risk = max(risk, 2)

                      alerts.append(f"【尾端资金吃紧橙灯】99分位 SOFR ({sofr_p99:.2f}%) 突破 SRF 上限 (4.00%)，且 SRF 被动用 ${srf_b}B")

              else:

                  if srf_b >= 15.0 or sofr_p99 > CURRENT_SRF_CEILING:

                      cautions.append(f"【月末/跨节资金紧绷提示】虽处月末结算窗口，但纽约联储 SRF 单日被借走 ${srf_b}B (99分位 SOFR 达 {sofr_p99:.2f}%)，显示一级交易商额度偏紧，反弹勿加过高杠杆")



              if (vix_c >= 28.0 and vix_is_rising) or (vix_c >= 25.0 and vix_chg >= 18.0):

                  risk = 3

                  alerts.append(f"【跨资产追保红灯】VIX 加速冲高至 {vix_c} (单日暴涨 {vix_chg:+.2f}%)，主经纪商追保易引发股金同跌")

              elif (vix_c >= 25.0 and vix_is_rising) or vix_chg >= 12.0:

                  risk = max(risk, 2)

                  alerts.append(f"【波动率升温橙灯】VIX 上行至 {vix_c} (单日 {vix_chg:+.2f}%)")



              if vix_is_cooling and vix_c <= 27.5 and risk < 3:

                  buys.append(

                      f"【恐慌退潮·右侧买点】VIX 从近5日高点 {vix_5d_h} 回落 {vix_pullback_from_high:.1f}% 至 {vix_c} (当日 {vix_chg:+.2f}%)，被动追保盘高峰已过"

                  )

              if repo_healed and not vix_is_rising:

                  buys.append(

                      f"【回购回血·右侧买点】SOFR-IORB 从近期高点 +{recent_max:.1f}bp 回落至 {spread_bps:+.1f}bp，隔夜资金管道压力解除"

                  )



              should_push = False

              sig_type = "🟡 日常静默巡检 (无新增买卖点，平时不打扰)"

              advice = "当前处于常规观察期，继续观望，无需操作"



              if risk == 3:

                  should_push = True

                  sig_type = "🔴 【危险警告·三级红灯】流动性逼仓 / VIX 加速冲顶"

                  advice = "立刻降杠杆防御！保留现金，严禁在 VIX 暴涨首日抄底黄金对冲"

              elif buys:

                  should_push = True

                  if srf_b >= 15.0:

                      sig_type = "💎 【右侧买点 (附月末SRF紧绷提示)】恐慌退潮但资金面偏紧"

                      advice = "VIX 追保恐慌已退潮，可分批止盈 Put 或轻仓回补核心科技股；但因今日 SRF 用量高达 $" + str(srf_b) + "B，切勿满仓追高"

                  else:

                      sig_type = "💎 【黄金买点信号】恐慌退潮 / 流动性回血"

                      advice = "分批止盈保护性 Put，逢低回补被错杀的核心科技股与黄金"

              elif risk == 2:

                  should_push = True

                  sig_type = "🟠 【减仓预警·二级橙灯】流动性或波动率升温"

                  advice = "主动削减高 Beta 科技/加密仓位，或买短期虚值 Put 保护"



              prefix = "【手动测试验活】" if (is_manual and not should_push) else ""

              title = f"{prefix}{sig_type} | SOFR {spread_bps:+.1f}bp | VIX {vix_c}"

              lines = [

                  f"### {prefix}{sig_type}",

                  f"**核心操作指令**：**{advice}**",

                  "",

              ]

              if buys:

                  lines.append("#### 💎 触发买点明细")

                  for s in buys:

                      lines.append(f"- {s}")

                  lines.append("")

              if alerts:

                  lines.append("#### ⚠️ 触发风险预警明细")

                  for s in alerts:

                      lines.append(f"- {s}")

                  lines.append("")

              if cautions:

                  lines.append("#### 📌 结构性资金面提示")

                  for s in cautions:

                      lines.append(f"- {s}")

                  lines.append("")



              lines.extend([

                  "#### 📊 纽约联储官方回购与跨资产快照",

                  f"- **SOFR 真实利率 ({latest['date']})**：`{latest['sofr']:.2f}%` vs IORB `3.90%`（利差 `{spread_bps:+.1f} bps`）",

                  f"- **99分位尾端利率 & SRF 用量**：99分位 `{sofr_p99:.2f}%`（SRF上限 `4.00%`）| **SRF单日用量 `${srf_b}B`** (`{srf_date}`)",

                  f"- **日历属性**：{latest['cal']}",

                  f"- **VIX 恐慌指数 ({vix_dt})**：`{vix_c}`（单日 `{vix_chg:+.2f}%`，近5日高点 `{vix_5d_h}`，距高点 `{vix_pullback_from_high:+.1f}%`）",

                  f"- **跨资产表现**：标普 `{spy_chg:+.2f}%` | 纳指 `{qqq_chg:+.2f}%` | 黄金 `{gld_chg:+.2f}%` | 美元 `{dxy_c}`",

              ])



              if should_push or is_manual:

                  send_pushplus(token, title, "\n".join(lines))

              else:

                  print("[SILENT] 今日无新增买卖点，保持静默。")

          except Exception as exc:

              print(traceback.format_exc())

              send_pushplus(token, "【美元流动性雷达】运行异常提醒", f"异常信息：`{exc}`")

          EOF
